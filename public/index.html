<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>⚽ FPL Friends League</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 class="title">⚽ FPL Friends League</h1>
        <p class="subtitle">
          Check your league standings, weekly points, and top performers.
        </p>
        <div class="input-section">
          <input
            type="text"
            id="leagueId"
            placeholder="Enter your League ID"
          />
          <button id="fetchBtn">Show Standings</button>
        </div>
        <p class="hint">
          Tip: Save your league ID to access it faster next time.
        </p>
      </div>

      <div id="output" class="output"></div>

      <footer class="footer">
        <p>❤️ Made by <span class="author">Olutoba Onikoyi</span></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
